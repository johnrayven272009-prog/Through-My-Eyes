<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Through My Eyes</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050817;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #050817;
}

#world {
  position: absolute;
  left: 0;
  top: 0;

  width: 2000px;
  height: 1400px;

  background:
    radial-gradient(circle at 10% 20%, white 0 1px, transparent 2px),
    radial-gradient(circle at 18% 8%, white 0 1px, transparent 2px),
    radial-gradient(circle at 27% 25%, white 0 1px, transparent 2px),
    radial-gradient(circle at 39% 12%, white 0 1px, transparent 2px),
    radial-gradient(circle at 52% 22%, white 0 1px, transparent 2px),
    radial-gradient(circle at 65% 9%, white 0 1px, transparent 2px),
    radial-gradient(circle at 76% 25%, white 0 1px, transparent 2px),
    radial-gradient(circle at 88% 12%, white 0 1px, transparent 2px),
    radial-gradient(circle at 96% 30%, white 0 1px, transparent 2px),
    linear-gradient(
      135deg,
      #050a1c,
      #08132b 45%,
      #0d1b32
    );

  will-change: transform;
}

/* =========================
   MOON
========================= */

#moon {
  position: absolute;

  width: 125px;
  height: 125px;

  right: 190px;
  top: 80px;

  background: #fff3c4;
  border-radius: 50%;

  box-shadow:
    0 0 25px rgba(255,243,196,.65),
    0 0 65px rgba(255,243,196,.25);
}

/* =========================
   TERRAIN
========================= */

.ground-patch {
  position: absolute;
  background: rgba(25,62,48,.55);
  border-radius: 50%;
  filter: blur(.5px);
  pointer-events: none;
}

.grass {
  position: absolute;

  width: 18px;
  height: 28px;

  border-left: 2px solid #315b48;
  border-right: 2px solid #315b48;

  transform: rotate(-8deg);

  opacity: .8;
  pointer-events: none;
}

.flower {
  position: absolute;
  font-size: 16px;
  filter: brightness(.7);
  pointer-events: none;
}

.rock {
  position: absolute;

  width: 30px;
  height: 18px;

  background: #39455a;

  border-radius: 60% 50% 45% 55%;

  box-shadow:
    inset 5px 3px 5px rgba(255,255,255,.08),
    0 5px 8px rgba(0,0,0,.3);

  pointer-events: none;
}

.bush {
  position: absolute;

  width: 75px;
  height: 42px;

  background:
    radial-gradient(
      circle at 20% 65%,
      #173c31 0 25px,
      transparent 26px
    ),
    radial-gradient(
      circle at 50% 45%,
      #1b4938 0 30px,
      transparent 31px
    ),
    radial-gradient(
      circle at 80% 65%,
      #15382e 0 25px,
      transparent 26px
    );

  pointer-events: none;
}

/* =========================
   PATH
========================= */

.path {
  position: absolute;

  background: #1c2940;

  border: 2px solid rgba(160,180,215,.1);

  border-radius: 100px;

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.25);

  pointer-events: none;
}

.path.one {
  width: 1250px;
  height: 115px;

  left: 360px;
  top: 600px;

  transform: rotate(5deg);
}

.path.two {
  width: 105px;
  height: 780px;

  left: 950px;
  top: 250px;

  transform: rotate(-5deg);
}

/* =========================
   TREES
========================= */

.tree {
  position: absolute;

  width: 70px;
  height: 105px;

  filter:
    brightness(.42)
    saturate(.8)
    drop-shadow(0 7px 7px rgba(0,0,0,.5));

  pointer-events: none;
}

.tree .top {
  position: absolute;

  width: 0;
  height: 0;

  border-left: 38px solid transparent;
  border-right: 38px solid transparent;
  border-bottom: 65px solid #16382f;

  left: -3px;
  top: 0;
}

.tree .middle {
  position: absolute;

  width: 0;
  height: 0;

  border-left: 32px solid transparent;
  border-right: 32px solid transparent;
  border-bottom: 58px solid #1b4436;

  left: 3px;
  top: 25px;
}

.tree .bottom {
  position: absolute;

  width: 0;
  height: 0;

  border-left: 27px solid transparent;
  border-right: 27px solid transparent;
  border-bottom: 50px solid #214b3a;

  left: 8px;
  top: 48px;
}

.tree .trunk {
  position: absolute;

  width: 12px;
  height: 28px;

  background: #241e1a;

  left: 29px;
  top: 77px;
}

/* =========================
   POND
========================= */

#pond {
  position: absolute;

  left: 1330px;
  top: 730px;

  width: 310px;
  height: 190px;

  background:
    radial-gradient(
      ellipse at center,
      #152f4b,
      #10243d 55%,
      #0b1a30
    );

  border-radius: 50%;

  border: 5px solid #132238;

  box-shadow:
    0 0 25px rgba(25,70,100,.35),
    inset 0 0 30px rgba(0,0,0,.4);

  pointer-events: none;
}

#pond::before,
#pond::after {
  content: "";

  position: absolute;

  border: 1px solid rgba(170,205,220,.16);

  border-radius: 50%;

  width: 120px;
  height: 40px;
}

#pond::before {
  left: 70px;
  top: 60px;
}

#pond::after {
  left: 110px;
  top: 95px;
}

/* =========================
   CAMPFIRE
========================= */

#campfire {
  position: absolute;

  left: 300px;
  top: 930px;

  width: 180px;
  height: 150px;

  pointer-events: none;
}

.fire-ring {
  position: absolute;

  width: 100px;
  height: 40px;

  left: 40px;
  top: 85px;

  border: 10px solid #303647;

  border-radius: 50%;
}

.fire {
  position: absolute;

  left: 63px;
  top: 30px;

  width: 55px;
  height: 75px;

  background:
    radial-gradient(
      ellipse at 50% 70%,
      #ffd56b 0 18%,
      #ff9c3a 20% 42%,
      #b84230 44% 62%,
      transparent 64%
    );

  filter:
    drop-shadow(0 0 15px rgba(255,140,50,.5));

  animation:
    fireFlicker .8s infinite alternate;
}

@keyframes fireFlicker {
  from {
    transform: scale(1) translateY(2px);
  }

  to {
    transform: scale(1.08) translateY(-3px);
  }
}

/* =========================
   BENCH
========================= */

.bench {
  position: absolute;

  width: 110px;
  height: 60px;

  pointer-events: none;
}

.bench-seat {
  position: absolute;

  width: 105px;
  height: 14px;

  background: #513e32;

  border-radius: 4px;

  top: 10px;
}

.bench-back {
  position: absolute;

  width: 105px;
  height: 12px;

  background: #5a4435;

  border-radius: 4px;

  top: 0;
}

.bench-leg {
  position: absolute;

  width: 9px;
  height: 35px;

  background: #382c26;

  top: 20px;
}

.bench-leg.left {
  left: 15px;
}

.bench-leg.right {
  right: 15px;
}

/* =========================
   FIREFLIES
========================= */

.firefly {
  position: absolute;

  width: 6px;
  height: 6px;

  background: #e7e5a5;

  border-radius: 50%;

  box-shadow:
    0 0 8px #e7e5a5,
    0 0 15px rgba(231,229,165,.5);

  pointer-events: none;

  animation:
    floatFirefly 3s infinite alternate ease-in-out;
}

@keyframes floatFirefly {
  from {
    transform: translate(0,0);
    opacity: .35;
  }

  to {
    transform: translate(18px,-15px);
    opacity: 1;
  }
}

/* =========================
   STARS
========================= */

.star {
  position: absolute;

  width: 55px;
  height: 55px;

  font-size: 48px;

  transform: translate(-50%,-50%);

  z-index: 40;

  filter:
    drop-shadow(0 0 8px rgba(255,255,220,.95))
    drop-shadow(0 0 18px rgba(255,255,220,.55));

  user-select: none;
}

.star.locked {
  filter:
    grayscale(1)
    brightness(.4);

  opacity: .65;
}
      .star {
  animation: starFloat 1.8s ease-in-out infinite;
}

@keyframes starFloat {

  0% {
    transform:
      translate(-50%, -50%)
      translateY(0px);
  }

  50% {
    transform:
      translate(-50%, -50%)
      translateY(-6px);
  }

  100% {
    transform:
      translate(-50%, -50%)
      translateY(0px);
  }

}

/* COLLECTION ANIMATION */

..star.collected {
  animation:
    starCollect 0.45s ease-out forwards;
}

@keyframes starCollect {

  0% {
    transform:
      translate(-50%, -50%)
      scale(1);
    opacity: 1;
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.5);
    opacity: 0;
  }

}

/* =========================
   PLAYER
========================= */

#player {

  left: 6px;

#player .leg {

  border-radius: 4px;
}

#player .leg.left {

#player .leg.right {

/* =========================
   UI
========================= */

#instructions {
  position: fixed;

  top: 18px;
  left: 50%;

  z-index: 100;

  padding: 10px 17px;

  border-radius: 25px;

  font-size: 14px;

  white-space: nowrap;
}

#counter {

  top: 18px;
  right: 16px;

  border-radius: 20px;

  background: rgba(4,9,24,.88);

  border: 1px solid rgba(255,255,255,.12);

  color: white;

  font-size: 14px;
}

       /* =========================
   JOYSTICK
========================= */

#joystick {
  position: fixed;

  left: 30px;
  bottom: 30px;

  width: 120px;
  height: 120px;

  border-radius: 50%;

  background: rgba(255, 255, 255, 0.15);

  border: 2px solid rgba(255, 255, 255, 0.35);

  z-index: 250;

  touch-action: none;
}

#joystickKnob {
  position: absolute;

  width: 50px;
  height: 50px;

  left: 35px;
  top: 35px;

  border-radius: 50%;

  background: rgba(255, 255, 255, 0.55);

  touch-action: none;
}
      
      /* =========================
   TALK PROMPT
========================= */

#talkPrompt {
  position: fixed;

  display: none;

  left: 50%;
  bottom: 90px;

  transform: translateX(-50%);

  padding: 8px 18px;

  background: rgba(0, 0, 0, 0.75);
  color: white;

  border-radius: 8px;

  font-size: 16px;

  z-index: 200;

  pointer-events: none;
}

/* =========================
   LOCK MESSAGE
========================= */

#lockMessage {
  position: fixed;

  left: 50%;
  bottom: 35px;

  transform: translateX(-50%);

  z-index: 150;

  padding: 12px 18px;

  border-radius: 20px;

  background: rgba(4,9,24,.95);

  border: 1px solid rgba(255,255,255,.12);

  color: white;

  font-size: 14px;

  display: none;
}

/* =========================
   POPUP
========================= */

#popup {
  position: fixed;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0,0,15,.78);
}

#popupBox {
  width: min(90vw,400px);

  max-height: 90vh;

  overflow-y: auto;

  padding: 18px;

  background: #10182b;

  border: 1px solid rgba(255,255,255,.15);

  border-radius: 22px;

  text-align: center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.5);
}

#popupImage {
  width: 100%;

  max-height: 55vh;

  object-fit: contain;

  border-radius: 15px;

  display: block;

  margin-bottom: 15px;
}

#popupTitle {
  color: white;

  font-size: 21px;

  margin-bottom: 10px;
}

#popupText {
  color: #d9deea;

  line-height: 1.6;

  font-size: 16px;
}

#continue {

  border-radius: 25px;

  padding: 12px 25px;

  background: #e8d58a;

  color: #10182b;

  font-size: 15px;

  font-weight: bold;
}
</style>
</head>

<script>

/* =========================

const game =

/* =========================

/* =========================

/* =========================
   CAMERA UPDATE
========================= */

function updateCamera() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  cameraX =
    (screenWidth / 2) - playerX;

  cameraY =
    (screenHeight / 2) - playerY;


  /*
    Don't let the camera
    move beyond the map.
  */

  const minCameraX =
    screenWidth - 2000;

  const minCameraY =
    screenHeight - 1400;


  cameraX =
    Math.min(
      0,
      Math.max(
        minCameraX,
        cameraX
      )
    );


  cameraY =
    Math.min(
      0,
      Math.max(
        minCameraY,
        cameraY
      )
    );


  world.style.transform =
    `translate3d(${cameraX}px, ${cameraY}px, 0)`;

}


/* =========================
   MOVE
========================= */

function movePlayer() {

  if (joystickActive) {

    playerX +=
      joystickX * speed;

    playerY +=
      joystickY * speed;

  }

  /*
    Keep player inside map.
  */

  playerX =
    Math.max(
      30,
      Math.min(
        1970,
        playerX
      )
    );

  playerY =
    Math.max(
      30,
      Math.min(
        1370,
        playerY
      )
    );

  player.style.left =
    playerX + "px";

  player.style.top =
    playerY + "px";

}

/* =========================
   DISTANCE
========================= */

function distanceBetween(
  x1,
  y1,
  x2,
  y2
) {

  const dx =
    x2 - x1;

  const dy =
    y2 - y1;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================
   LOCK MESSAGE
========================= */

let lockTimeout;

function showLockMessage(id) {

  lockMessage.textContent =
    `🔒 You need to find Star ${id - 1} first.`;

  lockMessage.style.display =
    "block";


  clearTimeout(lockTimeout);


  lockTimeout =
    setTimeout(
      function() {

        lockMessage.style.display =
          "none";

      },
      1800
    );

}


/* =========================
   CHECK STARS
========================= */

function checkStars() {

  stars.forEach(
    function(star) {

      if (
        star.dataset.collected === "true"

          playerY,

          starY

      if (distance < 70) {

        /*

        */

        if (id > unlockedStar) {

        /*

        star.dataset.collected =

star.classList.add(

setTimeout(

collectedStars++;

      /* =========================

function checkNPCs() {

    if (distance < 100) {

  if (nearNPC) {
    talkPrompt.style.display = "block";
  } else {
    talkPrompt.style.display = "none";
  }

} 
      
/* =========================
   JOYSTICK MOVEMENT
========================= */

const joystick =
  document.getElementById("joystick");

const joystickKnob =
  document.getElementById("joystickKnob");

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

joystick.addEventListener(
  "pointerdown",
  function(event) {

    joystickActive = true;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(event);

  }
);

joystick.addEventListener(
  "pointermove",
  function(event) {

    if (!joystickActive) {
      return;
    }

    updateJoystick(event);

  }
);

joystick.addEventListener(
  "pointerup",
  function(event) {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    joystickKnob.style.transform =
      "translate(0px, 0px)";

  }
);

joystick.addEventListener(
  "pointercancel",
  function() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    joystickKnob.style.transform =
      "translate(0px, 0px)";

  }
);

function updateJoystick(event) {

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;

  let dx =
    event.clientX - centerX;

  let dy =
    event.clientY - centerY;

  const maxDistance = 35;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (distance > maxDistance) {

    dx =
      (dx / distance) *
      maxDistance;

    dy =
      (dy / distance) *
      maxDistance;

  }

  joystickX =
    dx / maxDistance;

  joystickY =
    dy / maxDistance;

  joystickKnob.style.transform =
    `translate(${dx}px, ${dy}px)`;

}
      
/* =========================
   STAR LOCK VISUALS
========================= */

function updateStarLocks() {

  stars.forEach(
    function(star) {

      const id =
        Number(
          star.dataset.id
        );


      if (
        star.dataset.collected === "true"
      ) {

        star.style.display =
          "none";

        return;

      }


      if (id <= unlockedStar) {

        star.classList.remove(
          "locked"
        );

        star.textContent =
          "⭐";

      } else {

        star.classList.add(
          "locked"
        );

        star.textContent =
          "🔒";

      }

    }
  );

}

/* =========================
   CONTINUE
========================= */

let npcMessageOpen = false;

continueButton.addEventListener(
  "click",
  function() {

    popup.style.display = "none";

    /*
      Unlock the next star only
      after the message is read.
    */

    if (!npcMessageOpen) {
  if (unlockedStar < 8) {
    unlockedStar++;
  }

  updateStarLocks();
}

npcMessageOpen = false;

  }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

      checkNPCs();
      
  movePlayer();

  updateCamera();

  checkStars();

  requestAnimationFrame(
    gameLoop
  );

}


/* =========================

========================= */

player.style.left =

player.style.top =
  playerY + "px";

updateStarLocks();

updateCamera();

gameLoop();

</script>
