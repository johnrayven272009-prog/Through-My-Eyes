<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Through My Eyes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #16231a;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    /* GAME VIEW */
    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #79a96b;
    }

    /* THE WORLD */
    #world {
      position: absolute;
      width: 1800px;
      height: 1200px;
      left: 0;
      top: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 0 3px, transparent 4px),
        radial-gradient(circle at 70% 65%, rgba(255,255,255,.06) 0 3px, transparent 4px),
        #79a96b;
      transition: transform 0.05s linear;
    }

    /* LITTLE PATHS */
    .path {
      position: absolute;
      background: #c8ad7b;
      border-radius: 100px;
      opacity: 0.9;
    }

    .path.one {
      width: 1000px;
      height: 110px;
      left: 350px;
      top: 500px;
      transform: rotate(8deg);
    }

    .path.two {
      width: 100px;
      height: 700px;
      left: 850px;
      top: 200px;
      transform: rotate(-8deg);
    }

    /* TREES */
    .tree {
      position: absolute;
      width: 70px;
      height: 90px;
      font-size: 65px;
      user-select: none;
    }

    /* PLAYER */
    #player {
  position: absolute;
  width: 42px;
  height: 58px;
  left: 900px;
  top: 600px;
  z-index: 20;
  transform: translate(-50%, -50%);
  user-select: none;
}

/* HEAD */
#player .head {
  position: absolute;
  width: 28px;
  height: 28px;
  left: 7px;
  top: 4px;
  background: #f2c6a0;
  border-radius: 50%;
  z-index: 3;
}

/* HAIR */
#player .hair {
  position: absolute;
  width: 31px;
  height: 18px;
  left: 5px;
  top: 1px;
  background: #2b211d;
  border-radius: 18px 18px 8px 8px;
  z-index: 4;
}

/* BODY */
#player .body {
  position: absolute;
  width: 30px;
  height: 24px;
  left: 6px;
  top: 30px;
  background: #3d5366;
  border-radius: 7px 7px 4px 4px;
}

/* LEGS */
#player .leg {
  position: absolute;
  width: 9px;
  height: 15px;
  top: 50px;
  background: #20242a;
  border-radius: 4px;
  z-index: 1;
}

#player .leg.left {
  left: 9px;
}

#player .leg.right {
  right: 9px;
}

    /* STAR */
    .star {
      position: absolute;
      width: 55px;
      height: 55px;
      font-size: 48px;
      z-index: 10;
      transform: translate(-50%, -50%);
      animation: float 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.7));
    }

    @keyframes float {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0);
      }

      50% {
        transform: translate(-50%, -50%) translateY(-8px);
      }
    }

    /* MESSAGE AT TOP */
    #instructions {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;

      padding: 10px 17px;
      border-radius: 25px;

      background: rgba(20, 30, 22, .72);
      color: white;

      font-size: 14px;
      text-align: center;

      pointer-events: none;
      white-space: nowrap;
    }

    /* STAR COUNTER */
    #counter {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 100;

      padding: 9px 13px;
      border-radius: 20px;

      background: rgba(20, 30, 22, .72);
      color: white;

      font-size: 14px;
    }

    /* POPUP */
    #popup {
      position: fixed;
      inset: 0;
      z-index: 200;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 25px;
      background: rgba(0,0,0,.55);
    }

    #popupBox {
      width: min(90vw, 420px);
      padding: 25px;

      background: #fffdf7;
      border-radius: 22px;

      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    #popupBox h2 {
      margin-bottom: 12px;
      font-size: 22px;
      color: #27352a;
    }

    #popupBox p {
      color: #4b514c;
      line-height: 1.6;
      font-size: 16px;
    }

    #continue {
      margin-top: 20px;

      border: none;
      border-radius: 25px;
      padding: 11px 24px;

      background: #27352a;
      color: white;

      font-size: 15px;
    }
  </style>
</head>

<body>

  <div id="game">

    <div id="instructions">
      Tap anywhere to move ⭐
    </div>

    <div id="counter">
      ⭐ 0 / 1
    </div>

    <div id="world">

      <!-- PATHS -->
      <div class="path one"></div>
      <div class="path two"></div>

      <!-- TREES -->
      <div class="tree" style="left:120px; top:120px;">🌳</div>
      <div class="tree" style="left:300px; top:250px;">🌲</div>
      <div class="tree" style="left:500px; top:100px;">🌳</div>
      <div class="tree" style="left:700px; top:300px;">🌲</div>
      <div class="tree" style="left:1050px; top:130px;">🌳</div>
      <div class="tree" style="left:1300px; top:300px;">🌲</div>
      <div class="tree" style="left:1550px; top:150px;">🌳</div>

      <div class="tree" style="left:150px; top:800px;">🌲</div>
      <div class="tree" style="left:450px; top:950px;">🌳</div>
      <div class="tree" style="left:750px; top:850px;">🌲</div>
      <div class="tree" style="left:1100px; top:950px;">🌳</div>
      <div class="tree" style="left:1450px; top:800px;">🌲</div>
      <div class="tree" style="left:1650px; top:1000px;">🌳</div>

      <!-- FIRST STAR -->
      <div class="star" id="star1" style="left:1200px; top:600px;">
        ⭐
      </div>

      <!-- PLAYER -->
      <div id="player">
  <div class="hair"></div>
  <div class="head"></div>
  <div class="body"></div>
  <div class="leg left"></div>
  <div class="leg right"></div>
</div>

    </div>
  </div>

  <!-- POPUP -->
  <div id="popup">
    <div id="popupBox">
      <h2>⭐ You found something</h2>

      <p>
        This is where we'll eventually put one of Jil's pictures
        and one of your compliments.
      </p>

      <button id="continue">Continue</button>
    </div>
  </div>

  <script>

    const world = document.getElementById("world");
    const player = document.getElementById("player");
    const star = document.getElementById("star1");
    const popup = document.getElementById("popup");
    const continueButton = document.getElementById("continue");
    const counter = document.getElementById("counter");

    /* PLAYER POSITION */
    let playerX = 900;
    let playerY = 600;

    /* WHERE PLAYER IS GOING */
    let targetX = playerX;
    let targetY = playerY;

    /* MOVEMENT SPEED */
    const speed = 4;

    /* CAMERA */
    let cameraX = 0;
    let cameraY = 0;

    let starCollected = false;

    /* TAP TO MOVE */
    document.getElementById("game").addEventListener("pointerdown", function(event) {

      if (popup.style.display === "flex") return;

      targetX = event.clientX - cameraX;
      targetY = event.clientY - cameraY;

    });

    /* CHECK DISTANCE */
    function distanceBetween(x1, y1, x2, y2) {

      const dx = x2 - x1;
      const dy = y2 - y1;

      return Math.sqrt(dx * dx + dy * dy);

    }

    /* GAME LOOP */
    function update() {

      const dx = targetX - playerX;
      const dy = targetY - playerY;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 3) {

        playerX += (dx / distance) * speed;
        playerY += (dy / distance) * speed;

      }

      /* KEEP PLAYER INSIDE WORLD */

      playerX = Math.max(30, Math.min(1770, playerX));
      playerY = Math.max(30, Math.min(1170, playerY));

      /* MOVE PLAYER */

      player.style.left = playerX + "px";
      player.style.top = playerY + "px";

      /* CAMERA FOLLOWS PLAYER */

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      cameraX = screenWidth / 2 - playerX;
      cameraY = screenHeight / 2 - playerY;

      /* CAMERA LIMITS */

      cameraX = Math.min(0, Math.max(screenWidth - 1800, cameraX));
      cameraY = Math.min(0, Math.max(screenHeight - 1200, cameraY));

      world.style.transform =
        `translate(${cameraX}px, ${cameraY}px)`;

      /* CHECK STAR */

      if (!starCollected) {

        const starX = 1200;
        const starY = 600;

        const distanceToStar =
          distanceBetween(playerX, playerY, starX, starY);

        if (distanceToStar < 70) {

          starCollected = true;

          star.style.display = "none";

          counter.textContent = "⭐ 1 / 1";

          popup.style.display = "flex";

        }

      }

      requestAnimationFrame(update);

    }

    /* CLOSE POPUP */

    continueButton.addEventListener("click", function() {

      popup.style.display = "none";

    });

    update();

  </script>

</body>
</html>
