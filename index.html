<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Through My Eyes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050817;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #050817;
    }

    /* =========================
       NIGHT MAP
    ========================== */

    #world {
      position: absolute;
      width: 1800px;
      height: 1200px;

      background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 20% 42%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 10%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 43% 27%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 12%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 68% 24%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 79% 12%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 91% 25%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 15% 75%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 88%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 47% 72%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 90%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 81% 73%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        radial-gradient(circle at 94% 88%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        linear-gradient(
          135deg,
          #050b20,
          #09142d 45%,
          #0d1934
        );
    }

    /* MOON */

    #moon {
      position: absolute;
      right: 150px;
      top: 80px;

      width: 115px;
      height: 115px;

      border-radius: 50%;

      background: #fff4c7;

      box-shadow:
        0 0 20px rgba(255,244,199,.55),
        0 0 45px rgba(255,244,199,.25);

      z-index: 1;
    }

    #moon::after {
      content: "";

      position: absolute;

      width: 115px;
      height: 115px;

      border-radius: 50%;

      background: #09142d;

      left: 28px;
      top: -10px;
    }

    /* BACKGROUND STARS */

    .background-star {
      position: absolute;
      z-index: 2;

      color: white;

      font-size: 10px;

      opacity: .8;

      user-select: none;
    }

    .background-star.big {
      font-size: 15px;
    }

    /* =========================
       PATHS
    ========================== */

    .path {
      position: absolute;

      background: #202d48;

      border-radius: 100px;

      border: 2px solid rgba(160,180,215,.12);

      opacity: .95;
    }

    .path.one {
      width: 1000px;
      height: 110px;

      left: 350px;
      top: 500px;

      transform: rotate(8deg);
    }

    .path.two {
      width: 100px;
      height: 700px;

      left: 850px;
      top: 200px;

      transform: rotate(-8deg);
    }

    /* =========================
       TREES
    ========================== */

    .tree {
      position: absolute;

      width: 70px;
      height: 90px;

      font-size: 65px;

      user-select: none;

      filter:
        brightness(.35)
        saturate(.7)
        drop-shadow(0 5px 5px rgba(0,0,0,.5));
    }

    /* =========================
       PLAYER
    ========================== */

    #player {
      position: absolute;

      width: 42px;
      height: 58px;

      left: 900px;
      top: 600px;

      z-index: 20;

      transform: translate(-50%, -50%);

      user-select: none;

      filter:
        drop-shadow(0 0 7px rgba(255,255,255,.2));
    }

    #player .head {
      position: absolute;

      width: 28px;
      height: 28px;

      left: 7px;
      top: 4px;

      background: #f2c6a0;

      border-radius: 50%;

      z-index: 3;
    }

    #player .hair {
      position: absolute;

      width: 31px;
      height: 18px;

      left: 5px;
      top: 1px;

      background: #2b211d;

      border-radius: 18px 18px 8px 8px;

      z-index: 4;
    }

    #player .body {
      position: absolute;

      width: 30px;
      height: 24px;

      left: 6px;
      top: 30px;

      background: #3d5366;

      border-radius: 7px 7px 4px 4px;
    }

    #player .leg {
      position: absolute;

      width: 9px;
      height: 15px;

      top: 50px;

      background: #20242a;

      border-radius: 4px;
    }

    #player .leg.left {
      left: 9px;
    }

    #player .leg.right {
      right: 9px;
    }

    /* =========================
       COLLECTIBLE STARS
    ========================== */

    .star {
      position: absolute;

      width: 55px;
      height: 55px;

      font-size: 48px;

      z-index: 10;

      transform: translate(-50%, -50%);

      filter:
        drop-shadow(0 0 8px rgba(255,255,220,.95))
        drop-shadow(0 0 18px rgba(255,255,220,.5));

      user-select: none;
    }

    /* LOCKED STARS */

    .star.locked {
      filter: grayscale(1) brightness(.45);

      opacity: .6;
    }

    /* =========================
       TOP UI
    ========================== */

    #instructions {
      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 100;

      padding: 10px 17px;

      border-radius: 25px;

      background: rgba(4,9,24,.8);

      border: 1px solid rgba(255,255,255,.12);

      color: white;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;
    }

    #counter {
      position: fixed;

      top: 18px;
      right: 16px;

      z-index: 100;

      padding: 9px 13px;

      border-radius: 20px;

      background: rgba(4,9,24,.8);

      border: 1px solid rgba(255,255,255,.12);

      color: white;

      font-size: 14px;
    }

    /* =========================
       LOCK MESSAGE
    ========================== */

    #lockMessage {
      position: fixed;

      left: 50%;
      bottom: 35px;

      transform: translateX(-50%);

      z-index: 150;

      padding: 12px 18px;

      border-radius: 20px;

      background: rgba(4,9,24,.92);

      border: 1px solid rgba(255,255,255,.12);

      color: white;

      font-size: 14px;

      text-align: center;

      display: none;
    }

    /* =========================
       POPUP
    ========================== */

    #popup {
      position: fixed;

      inset: 0;

      z-index: 200;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,15,.75);
    }

    #popupBox {
      width: min(90vw, 400px);

      max-height: 90vh;

      overflow-y: auto;

      padding: 18px;

      background: #10182b;

      border: 1px solid rgba(255,255,255,.15);

      border-radius: 22px;

      text-align: center;

      box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        0 0 25px rgba(100,130,200,.15);
    }

    #popupImage {
      width: 100%;

      max-height: 55vh;

      object-fit: contain;

      border-radius: 15px;

      display: block;

      margin-bottom: 15px;
    }

    #popupTitle {
      margin-bottom: 10px;

      color: white;

      font-size: 21px;
    }

    #popupText {
      color: #d9deea;

      line-height: 1.6;

      font-size: 16px;
    }

    #continue {
      margin-top: 18px;

      border: none;

      border-radius: 25px;

      padding: 12px 25px;

      background: #e8d58a;

      color: #10182b;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }
  </style>
</head>
