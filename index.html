<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Through My Eyes</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #16231a;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #79a96b;
}

#world {
  position: absolute;
  width: 1800px;
  height: 1200px;
  background: #79a96b;
}

/* PATHS */

.path {
  position: absolute;
  background: #c8ad7b;
  border-radius: 100px;
  opacity: .9;
}

.path.one {
  width: 1000px;
  height: 110px;
  left: 350px;
  top: 500px;
  transform: rotate(8deg);
}

.path.two {
  width: 100px;
  height: 700px;
  left: 850px;
  top: 200px;
  transform: rotate(-8deg);
}

/* TREES */

.tree {
  position: absolute;
  width: 70px;
  height: 90px;
  font-size: 65px;
  user-select: none;
}

/* PLAYER */

#player {
  position: absolute;
  width: 42px;
  height: 58px;
  left: 900px;
  top: 600px;
  z-index: 20;
  transform: translate(-50%, -50%);
  user-select: none;
}

#player .head {
  position: absolute;
  width: 28px;
  height: 28px;
  left: 7px;
  top: 4px;
  background: #f2c6a0;
  border-radius: 50%;
  z-index: 3;
}

#player .hair {
  position: absolute;
  width: 31px;
  height: 18px;
  left: 5px;
  top: 1px;
  background: #2b211d;
  border-radius: 18px 18px 8px 8px;
  z-index: 4;
}

#player .body {
  position: absolute;
  width: 30px;
  height: 24px;
  left: 6px;
  top: 30px;
  background: #3d5366;
  border-radius: 7px 7px 4px 4px;
}

#player .leg {
  position: absolute;
  width: 9px;
  height: 15px;
  top: 50px;
  background: #20242a;
  border-radius: 4px;
}

#player .leg.left {
  left: 9px;
}

#player .leg.right {
  right: 9px;
}

/* STARS */

.star {
  position: absolute;
  width: 55px;
  height: 55px;
  font-size: 48px;
  z-index: 10;
  transform: translate(-50%, -50%);
  animation: float 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(255,255,255,.7));
}

@keyframes float {
  0%, 100% {
    transform: translate(-50%, -50%) translateY(0);
  }

  50% {
    transform: translate(-50%, -50%) translateY(-8px);
  }
}

/* UI */

#instructions {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;

  padding: 10px 17px;
  border-radius: 25px;

  background: rgba(20,30,22,.72);
  color: white;

  font-size: 14px;
  text-align: center;
  white-space: nowrap;
}

#counter {
  position: fixed;
  top: 18px;
  right: 16px;
  z-index: 100;

  padding: 9px 13px;
  border-radius: 20px;

  background: rgba(20,30,22,.72);
  color: white;

  font-size: 14px;
}

/* POPUP */

#popup {
  position: fixed;
  inset: 0;
  z-index: 200;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;
  background: rgba(0,0,0,.65);
}

#popupBox {
  width: min(90vw, 400px);
  max-height: 90vh;
  overflow-y: auto;

  padding: 18px;
  background: #fffdf7;
  border-radius: 22px;

  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);

  animation: popupIn .25s ease;
}

@keyframes popupIn {
  from {
    transform: scale(.85);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

#popupImage {
  width: 100%;
  max-height: 55vh;
  object-fit: contain;
  border-radius: 15px;
  display: block;
  margin-bottom: 15px;
}

#popupTitle {
  margin-bottom: 10px;
  color: #27352a;
  font-size: 21px;
}

#popupText {
  color: #4b514c;
  line-height: 1.6;
  font-size: 16px;
}

#continue {
  margin-top: 18px;
  border: none;
  border-radius: 25px;
  padding: 12px 25px;

  background: #27352a;
  color: white;

  font-size: 15px;
}
</style>
</head>

<body>

<div id="game">

  <div id="instructions">
    Tap anywhere to move ⭐
  </div>

  <div id="counter">
    ⭐ 0 / 8
  </div>

  <div id="world">

    <!-- PATHS -->

    <div class="path one"></div>
    <div class="path two"></div>

    <!-- TREES -->

    <div class="tree" style="left:120px; top:120px;">🌳</div>
    <div class="tree" style="left:300px; top:250px;">🌲</div>
    <div class="tree" style="left:500px; top:100px;">🌳</div>
    <div class="tree" style="left:700px; top:300px;">🌲</div>
    <div class="tree" style="left:1050px; top:130px;">🌳</div>
    <div class="tree" style="left:1300px; top:300px;">🌲</div>
    <div class="tree" style="left:1550px; top:150px;">🌳</div>

    <div class="tree" style="left:150px; top:800px;">🌲</div>
    <div class="tree" style="left:450px; top:950px;">🌳</div>
    <div class="tree" style="left:750px; top:850px;">🌲</div>
    <div class="tree" style="left:1100px; top:950px;">🌳</div>
    <div class="tree" style="left:1450px; top:800px;">🌲</div>
    <div class="tree" style="left:1650px; top:1000px;">🌳</div>

    <!-- 8 STARS -->

    <div class="star" data-id="1" style="left:250px; top:400px;">⭐</div>
    <div class="star" data-id="2" style="left:500px; top:750px;">⭐</div>
    <div class="star" data-id="3" style="left:750px; top:250px;">⭐</div>
    <div class="star" data-id="4" style="left:1050px; top:850px;">⭐</div>
    <div class="star" data-id="5" style="left:1250px; top:400px;">⭐</div>
    <div class="star" data-id="6" style="left:1450px; top:700px;">⭐</div>
    <div class="star" data-id="7" style="left:1550px; top:350px;">⭐</div>
    <div class="star" data-id="8" style="left:1600px; top:900px;">⭐</div>

    <!-- PLAYER -->

    <div id="player">
      <div class="hair"></div>
      <div class="head"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

  </div>
</div>

<!-- POPUP -->

<div id="popup">

  <div id="popupBox">

    <img id="popupImage" src="" alt="Memory">

    <h2 id="popupTitle">
      ⭐ A little something
    </h2>

    <p id="popupText">
      Your compliment will go here.
    </p>

    <button id="continue">
      Continue
    </button>

  </div>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

const stars = document.querySelectorAll(".star");

const popup = document.getElementById("popup");
const popupImage = document.getElementById("popupImage");
const popupTitle = document.getElementById("popupTitle");
const popupText = document.getElementById("popupText");
const continueButton = document.getElementById("continue");
const counter = document.getElementById("counter");


/* =========================
   PLAYER
========================= */

let playerX = 900;
let playerY = 600;

let targetX = 900;
let targetY = 600;

const speed = 5;


/* =========================
   CAMERA
========================= */

let cameraX = 0;
let cameraY = 0;


/* =========================
   STARS
========================= */

let collectedStars = 0;

stars.forEach(function(star) {
  star.dataset.collected = "false";
});


/* =========================
   COMPLIMENTS
========================= */

const starContent = {

  1: {
    image: "photos/photo1.jpg",
    title: "⭐ Just You",
    text: "Jil, I don't think you realize how much I appreciate you just for being you. You don't have to do anything special or prove anything to me para maging someone worth appreciating."
  },

  2: {
    image: "photos/photo2.jpg",
    title: "⭐ The Little Things",
    text: "There's just something about you na I can't really explain. Kahit yung mga normal na bagay about you, somehow they mean more to me than you probably realize."
  },

  3: {
    image: "photos/photo3.jpg",
    title: "⭐ You're Enough",
    text: "I know you have things about yourself na you're insecure about, pero sana alam mo na those things don't define you. Hindi naman kailangan maging perfect ka para maging someone na worth appreciating."
  },

  4: {
    image: "photos/photo4.jpg",
    title: "⭐ How I See You",
    text: "Sometimes I wish you could see yourself the way other people see you, especially the people who genuinely appreciate you. Kasi baka mas makita mo rin yung good things about yourself na lagi mong nami-miss."
  },

  5: {
    image: "photos/photo5.jpg",
    title: "⭐ The Weird You",
    text: "I appreciate you as you are, kahit yung random side mo, yung pagiging weird mo HAHAHA. Pero mas weird ata ako kaya wala rin akong masabi 😭. I actually like those little things about you kasi yun yung nagpapaka-you sayo."
  },

  6: {
    image: "photos/photo6.jpg",
    title: "⭐ Be Yourself",
    text: "You don't have to change yourself just because you think there's something wrong with you. There's nothing wrong with being yourself, and I hope someday you can be as kind to yourself as you are to other people."
  },

  7: {
    image: "photos/photo7.jpg",
    title: "⭐ Almost There",
    text: "And we're almost at the end HAHAHA. But honestly, I could probably keep going because eight stars isn't nearly enough to put every reason why I appreciate you."
  },

  8: {
    image: "photos/photo8.jpg",
    title: "⭐ Through My Eyes",
    text: "If you made it this far, just know na every picture here was another reason I appreciate you. I just wish you could see yourself through my eyes para ma-realize mo what I see in you. I wish you could see the stars the way I see them in you, even sa mga bagay na tingin mo ordinary lang. Sana one day makita mo rin sa sarili mo yung mga bagay na matagal ko nang nakikita sayo."
  }

};


/* =========================
   TAP TO MOVE
========================= */

game.addEventListener("pointerdown", function(event) {

  if (popup.style.display === "flex") {
    return;
  }

  targetX = event.clientX - cameraX;
  targetY = event.clientY - cameraY;

});


/* =========================
   DISTANCE
========================= */

function distanceBetween(x1, y1, x2, y2) {

  const dx = x2 - x1;
  const dy = y2 - y1;

  return Math.sqrt(dx * dx + dy * dy);
}


/* =========================
   CHECK STARS
========================= */

function checkStars() {

  stars.forEach(function(star) {

    if (star.dataset.collected === "true") {
      return;
    }

    const starX = parseFloat(star.style.left);
    const starY = parseFloat(star.style.top);

    const distance = distanceBetween(
      playerX,
      playerY,
      starX,
      starY
    );

    if (distance < 75) {

      const id = star.dataset.id;
      const content = starContent[id];

      star.dataset.collected = "true";
      star.style.display = "none";

      collectedStars++;

      counter.textContent =
        "⭐ " + collectedStars + " / 8";

      popupImage.src = content.image;
      popupTitle.textContent = content.title;
      popupText.textContent = content.text;

      popup.style.display = "flex";
    }

  });

}


/* =========================
   CONTINUE
========================= */

continueButton.addEventListener("click", function() {

  popup.style.display = "none";

});


/* =========================
   GAME LOOP
========================= */

function update() {

  const dx = targetX - playerX;
  const dy = targetY - playerY;

  const distance = Math.sqrt(
    dx * dx + dy * dy
  );

  if (distance > 3) {

    playerX += (dx / distance) * speed;
    playerY += (dy / distance) * speed;

  }


  /* WORLD LIMITS */

  playerX = Math.max(
    30,
    Math.min(1770, playerX)
  );

  playerY = Math.max(
    30,
    Math.min(1170, playerY)
  );


  /* PLAYER */

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";


  /* CAMERA */

  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  cameraX =
    screenWidth / 2 - playerX;

  cameraY =
    screenHeight / 2 - playerY;

  cameraX = Math.min(
    0,
    Math.max(
      screenWidth - 1800,
      cameraX
    )
  );

  cameraY = Math.min(
    0,
    Math.max(
      screenHeight - 1200,
      cameraY
    )
  );


  world.style.transform =
    "translate(" + cameraX + "px, " + cameraY + "px)";


  checkStars();

  requestAnimationFrame(update);
}


/* =========================
   START GAME
========================= */

update();

</script>

</body>
</html>
